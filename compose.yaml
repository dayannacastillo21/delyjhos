services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports: ["8000:8000"]
    volumes: ["uploads:/app/uploads"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  uploads:
